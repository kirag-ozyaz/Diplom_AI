# Ollama — базовый compose (CPU). Работает без NVIDIA Container Toolkit.
# NVIDIA GPU (RTX 2060 и др.) — docker-compose.gpu.yml, нужен NVIDIA Container Toolkit.
# С GPU: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Автовыбор GPU/CPU: python scripts/start_ollama.py (из корня репозитория)

services:
  # Сервис ИИ
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Сервис бота (моя логика не реализована, может отдельно сделаю в будущем)
  # Сейчас бот: src/bot + infra/docker/Dockerfile.bot/ (не раскомментировать без общей docker-сети с Milvus)
  #backend:
  #  build: ./backend
  #  container_name: telegram_bot
  #  environment:
  #    # Внутри сети Docker обращаемся по имени сервиса 'ollama'
  #    - OLLAMA_HOST=http://ollama:11434
  #    - TG_BOT_TOKEN=${TG_BOT_TOKEN}
  #  depends_on:
  #    - ollama
  #  restart: unless-stopped

volumes:
  ollama_data:
